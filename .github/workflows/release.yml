# Push tag dạng v0.1.0 → build bộ cài NSIS + MSI → tạo GitHub Release ở dạng nháp (draft).
# Xem lại Release trên GitHub rồi bấm Publish.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build installers & draft release
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # tạo Release và tải bộ cài lên
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tag phải khớp version ở cả ba nơi, nếu không bộ cài sẽ mang số phiên bản sai.
      - name: Check tag matches app version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $conf  = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg   = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Host "tag=$env:TAG tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo"
          if ($env:TAG -ne "v$conf" -or $pkg -ne $conf -or $cargo -ne $conf) {
            Write-Error "Tag $env:TAG không khớp version (tauri.conf.json=$conf, package.json=$pkg, Cargo.toml=$cargo)."
            exit 1
          }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & upload to draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Cleaner Max v__VERSION__
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          releaseBody: |
            **Tải về:** `Cleaner.Max_*_x64-setup.exe` (NSIS, khuyên dùng) hoặc `Cleaner.Max_*_x64_en-US.msi`.

            Bộ cài chưa được ký số, nên Windows SmartScreen sẽ cảnh báo. Bấm **More info → Run anyway** để cài.
            _The installer is not code-signed yet. On the SmartScreen prompt, click **More info → Run anyway**._

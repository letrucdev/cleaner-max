[package]
name = "cleaner-max"
version = "0.1.0"
description = "Cleaner Max — dọn dung lượng Windows, WSL và Docker"
authors = ["letrucdev"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cleaner_max_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
kondo-lib = "0.9"
walkdir = "2.5.0"
rayon = "1.12.0"
sysinfo = "0.40"
runas = "1"
window-vibrancy = "0.8"
dirs = "7.0.0"
thiserror = "2.0.21"
log = "0.4.35"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
tauri-plugin-store = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-os = "2"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
winreg = "0.56.0"
which = "8.0.6"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
